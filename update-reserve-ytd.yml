name: Update reserve YTD history

on:
  workflow_dispatch:
  schedule:
    - cron: "25 4 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas requests
      - run: python fetch_reserve_ytd.py
      - name: Commit updated reserve history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reserve_capacity_ytd.csv
          git diff --cached --quiet && exit 0
          git commit -m "Update reserve capacity YTD history"
          git push
