name: Update EEX gas history archive
on:
  workflow_dispatch:
  schedule:
    - cron: "20 7 * * *"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python fetch_gas_ngp_archive.py
      - name: Commit archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gas_ngp_history.csv
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update EEX gas NGP archive"
            git push
          fi
