name: Update BalticPulse futures

on:
  workflow_dispatch:
  schedule:
    - cron: "12 * * * *"

permissions:
  contents: write

concurrency:
  group: balticpulse-futures
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas requests lxml html5lib beautifulsoup4 playwright

      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Verify Playwright
        run: |
          python -c "import playwright; print('Playwright import OK')"
          python -c "from playwright.sync_api import sync_playwright; print('Playwright sync API OK')"

      - name: Verify Chromium
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:
              browser = p.chromium.launch(
                  headless=True,
                  args=[
                      "--disable-dev-shm-usage",
                      "--no-sandbox"
                  ]
              )

              page = browser.new_page()
              page.set_content("<h1>BalticPulse</h1>")

              assert page.locator("h1").inner_text() == "BalticPulse"

              print("Chromium launch OK")

              browser.close()
          PY

      - name: Fetch official futures data
        run: |
          python fetch_futures_snapshot.py

      - name: Validate futures snapshot
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/futures.json")

          if not path.exists():
              raise SystemExit(
                  "ERROR: data/futures.json was not created"
              )

          payload = json.loads(
              path.read_text(encoding="utf-8")
          )

          print(
              "updated_at:",
              payload.get("updated_at")
          )

          available = False

          for section in [
              "power",
              "gas",
              "brent"
          ]:
              data = payload.get(section, {}) or {}

              curve = data.get("curve", []) or []
              key = data.get("key", []) or []
              errors = data.get("errors", []) or []

              print(
                  f"{section}: "
                  f"curve={len(curve)}, "
                  f"key={len(key)}, "
                  f"errors={len(errors)}"
              )

              if data.get("observed_at"):
                  print(
                      f"{section} observed_at: "
                      f"{data.get('observed_at')}"
                  )

              if data.get("fallback"):
                  print(
                      f"{section} fallback: "
                      f"{data.get('fallback')}"
                  )

              if curve:
                  available = True

              if errors:
                  for error in errors:
                      print(
                          f"{section} ERROR: {error}"
                      )

          if not available:
              raise SystemExit(
                  "ERROR: futures snapshot contains no market data"
              )

          print("Futures snapshot validation OK")
          PY

      - name: Show futures diagnostics
        if: always()
        run: |
          if [ ! -f data/futures.json ]; then
            echo "data/futures.json does not exist"
          fi

      - name: Commit futures snapshot
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/futures.json

          if git diff --cached --quiet; then
            echo "No futures snapshot changes"
          else
            git commit -m "Update BalticPulse futures"
            # Other scheduled workflows also commit to main. Incorporate their
            # changes and retry if one wins the race before this push.
            for attempt in 1 2 3 4 5 6; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "Futures snapshot published (attempt ${attempt})"
                exit 0
              fi
              echo "Push raced with another workflow (attempt ${attempt}); retrying"
              sleep 3
            done
            echo "Failed to publish futures snapshot after 6 attempts" >&2
            exit 1
          fi
