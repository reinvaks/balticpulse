      - name: Commit futures snapshot
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/futures.json

          if git diff --cached --quiet; then
            echo "No futures snapshot changes"
          else
            git commit -m "Update BalticPulse futures"

            for attempt in 1 2 3 4 5 6; do
              git fetch origin main
              git rebase origin/main

              if git push origin HEAD:main; then
                echo "Futures snapshot published (attempt ${attempt})"
                exit 0
              fi

              echo "Another workflow updated main; retrying (attempt ${attempt})"
              sleep 3
            done

            echo "Failed to publish futures snapshot after 6 attempts" >&2
            exit 1
          fi
