- name: Install Python dependencies
  run: |
    python -m pip install --upgrade pip
    python -m pip install pandas requests lxml html5lib beautifulsoup4 playwright

- name: Install Playwright Chromium
  run: |
    python -m playwright install --with-deps chromium

- name: Verify Playwright installation
  run: |
    python -c "import playwright; print('Playwright import OK')"
    python -c "from playwright.sync_api import sync_playwright; print('Playwright sync API OK')"

- name: Verify Chromium
  run: |
    python - <<'PY'
    from playwright.sync_api import sync_playwright

    with sync_playwright() as p:
        browser = p.chromium.launch(headless=True)
        print("Chromium launch OK")
        browser.close()
    PY

- name: Fetch official futures data
  run: |
    python fetch_futures_snapshot.py
