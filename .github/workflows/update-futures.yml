name: Update BalticPulse futures

on:
  workflow_dispatch:
  schedule:
    - cron: "12 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pandas requests lxml html5lib beautifulsoup4

      - name: Fetch futures
        run: python fetch_futures_snapshot.py

      - name: Commit futures snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/futures.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update BalticPulse futures"
            git push
          fi
