name: Update BalticPulse futures

on:
  workflow_dispatch:
  schedule:
    - cron: "12 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install parser dependencies
        run: |
          pip install pandas requests lxml html5lib beautifulsoup4 playwright
          python -m playwright install --with-deps chromium

      - name: Fetch official futures data
        run: python fetch_futures_snapshot.py

      - name: Show snapshot diagnostics
        if: always()
        run: |
          echo "---- futures.json ----"
          test -f data/futures.json && cat data/futures.json || true

      - name: Commit futures snapshot
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/futures.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update BalticPulse futures"
            git push
          fi
